services:
  - name: user-service
    container: user-service
    commands:
      - php artisan db:seed --class=DatabaseSeeder
    depends_on: []

  - name: product-service
    container: product-service
    commands:
      - php artisan db:seed --class=DatabaseSeeder
    depends_on: [user-service]

